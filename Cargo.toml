[package]
name = "scionic-merkletree"
version = "2.5.6"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Scionic Merkle trees: a folder of files under one root, with identical chunks, files and folders stored once, and any part of it shown and checked without the rest"
license = "MIT"

[dependencies]
sha2 = { version = "0.11", default-features = false }

# Opening a file from the folder it is in, and never through a link: the
# standard library has no way to do that without `unsafe`. Used on Unix only.
# On Windows the same is done with what the standard library has.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

# Telling whether two open files are one file, by the volume it is on and its
# number there: the standard library has no way to do that without `unsafe`
# either. Used on Windows only, where a file that something stands in for has
# to be opened a second time.
[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"
