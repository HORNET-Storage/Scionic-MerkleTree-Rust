[package]
name = "scionic-merkletree"
version = "2.5.6"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Scionic Merkle trees: a folder of files under one root, with identical pieces, files and folders stored once, and any part of it shown and checked without the rest"
license = "MIT"

[dependencies]
sha2 = { version = "0.11", default-features = false }

# Opening a file from the folder it is in, and never through a link: the
# standard library has no way to do that without `unsafe`. Used on Unix only.
# On Windows the same is done with what the standard library has.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }
