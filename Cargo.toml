[package]
name = "scionic-merkletree"
version = "2.5.6"
edition = "2021"
rust-version = "1.85"
description = "Scionic Merkle trees: a folder of files under one root, with identical chunks, files and folders stored once, and any part of it shown and checked without the rest"
license = "MIT"
repository = "https://github.com/HORNET-Storage/Scionic-MerkleTree-Rust"
keywords = ["merkle", "merkle-tree", "deduplication", "chunking", "sync"]
categories = ["data-structures", "cryptography", "filesystem"]
# What the repository keeps for its own work, and not for the crate's users.
exclude = [".github/", "AGENTS.md"]

[dependencies]
sha2 = { version = "0.11", default-features = false }

# Threads that are kept from one batch of work to the next. Starting a thread
# for each batch costs tens of microseconds, and more on Windows, which every
# batch of chunks waited for. Lending work that borrows from its caller to
# threads that are kept takes `unsafe` code: rayon holds it, and this crate
# does not (`src/threads.rs` says more).
rayon = "1.12"

# Opening a file from the folder it is in, and never through a link: the
# standard library has no way to do that without `unsafe`. Used on Unix only.
# On Windows the same is done with what the standard library has.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

# Telling whether two open files are one file, by the volume it is on and its
# 128-bit number there, which no safe call of the standard library or of a
# package gives. Used on Windows only, where a file that something stands in for
# has to be opened a second time: Microsoft's own bindings, called from the one
# function in the crate that holds `unsafe` code (`src/disk.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
