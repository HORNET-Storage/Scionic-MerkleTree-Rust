name: CI

# The same checks that are run locally before a commit:
# clippy across every target with warnings promoted to errors, then the full
# test suite, which holds the library to the vectors under spec/.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: clippy -D warnings + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
